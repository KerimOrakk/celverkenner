# Houdt de gratis Render-backend wakker: elke 10 minuten een verzoek aan /health,
# zodat bezoekers niet 50 seconden wachten op een slapende instance.
#
# Werkt zodra dit bestand op GitHub staat (Actions -> "Keep backend awake").
# Let op: GitHub zet geplande workflows uit als er 60 dagen geen commit is;
# een willekeurige commit zet ze weer aan. Alternatief: uptimerobot.com (gratis)
# met dezelfde URL, elke 5 minuten.
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://celverkenner.onrender.com' }}
        run: |
          curl -fsS --max-time 90 "$BACKEND_URL/health" && echo " ok" || echo "backend antwoordde niet (mag af en toe gebeuren)"
